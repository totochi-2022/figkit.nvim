<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>annot</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #f6f6f6; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #ddd; } }
  /* figure studio と同じ見た目の言語に揃える:
     左のグラデーション帯 + グラデーション文字のタイトル + モノスペースの副題。
     studio は縦 2rem の見出しだが、こちらは編集領域を優先して1行に収める。 */
  #bar {
    flex: 0 0 auto; display: flex; gap: .7rem; align-items: center;
    padding: .3rem .6rem; font-size: 12px; border-bottom: 1px solid #8884;
  }
  #accent {
    width: 8px; height: 26px; border-radius: 4px; flex: 0 0 auto;
    background: linear-gradient(180deg, #5aa0e0, #9b6ce0);
  }
  #title {
    font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1;
    background: linear-gradient(90deg, #5aa0e0 10%, #9b6ce0 90%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #subtitle {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .72rem; letter-spacing: .08em; color: #8b93a7;
  }
  #subtitle .arrow { color: #9b6ce0; }
  #mosaic, #grain { font: inherit; font-size: 12px; padding: .15rem .45rem; cursor: pointer;
    border: 1px solid #8886; border-radius: 5px; background: transparent; color: inherit; }
  #mosaic.on {
    background: linear-gradient(90deg, #5aa0e0, #9b6ce0);
    color: #fff; border-color: transparent;
  }
  #note { opacity: .6; }
  #msg { margin-left: auto; opacity: .85; }
  #msg.err { color: #e06c75; opacity: 1; }
  #host { flex: 1 1 auto; min-height: 0; }
  mjsui-annotation-editor { display: block; width: 100%; height: 100%; }

  /* 作業サイズのパネル。エディタ右下のズームボタンのすぐ上に重ねる */
  #sizebox {
    position: fixed; right: 14px; bottom: 54px; z-index: 10;
    display: flex; align-items: center; gap: .3rem;
    padding: .25rem .5rem; font-size: 12px; border-radius: 6px;
    background: #fffffff2; border: 1px solid #8886; color: #222;
    box-shadow: 0 1px 4px #0002;
  }
  @media (prefers-color-scheme: dark) {
    #sizebox { background: #2b2b2bf2; border-color: #aaa5; color: #ddd; }
  }
  #sizebox .lbl { opacity: .7; }
  #w { width: 4.2rem; font: inherit; text-align: right; padding: .1rem .2rem; }
  #pct { opacity: .7; }
  #apply { font: inherit; font-size: 11px; padding: .1rem .45rem; cursor: pointer;
    border: 1px solid transparent; border-radius: 5px; color: #fff;
    background: linear-gradient(90deg, #5aa0e0, #9b6ce0); }
  #view { opacity: .55; border-left: 1px solid #8884; padding-left: .45rem; }

</style>
</head>
<body>
<div id="bar">
  <div id="accent"></div>
  <div>
    <div id="title">image&nbsp;annot</div>
    <div id="subtitle"><span id="name">…</span> <span class="arrow">→</span> 注釈&nbsp;·&nbsp;PNG</div>
  </div>
  <button id="mosaic" type="button" title="ドラッグした矩形をモザイクで潰します">▦ モザイク</button>
  <select id="grain" title="モザイクの粗さ">
    <option value="8">細かい</option>
    <option value="14" selected>ふつう</option>
    <option value="26">粗い</option>
  </select>
  <span id="note">まず右下で作業サイズを決める → あとは原寸で描く（画面がそのまま保存されます）</span>
  <span id="msg"></span>
</div>
<div id="host"></div>

<div id="sizebox">
  <span class="lbl">作業サイズ</span>
  <input id="w" type="number" min="16" step="10" title="この大きさの画像に注釈を描きます（= 保存される大きさ）">
  <span id="rest">×  ―</span>
  <span id="pct">―</span>
  <button id="apply" type="button" title="この大きさで作り直します（描いた注釈は同じ比率で追従します）">適用</button>
  <span id="view" title="編集画面の拡大率。100% のときだけ実寸で見ています（100% に戻すのは右下の ⊡）">表示 100%</span>
</div>

<!-- markerjs3(グローバル markerjs3) → markerjs-ui(グローバル markerjsUI) の順で読む -->
<script src="vendor/markerjs3.umd.js"></script>
<script src="vendor/markerjs-ui.umd.js"></script>
<script>
/* 設計の要点 ───────────────────────────────────────────────────────────
 * 「作業サイズ = 出力サイズ」にして、**常に原寸(1:1)で描く**。
 * こうすると編集画面がそのまま仕上がりになり、位置も文字の大きさも見たままになる。
 * ズームは純粋な虫眼鏡（全部が同じ比率で拡大されるので何も歪まない）。
 *
 * 以前は原寸の画像に描いて書き出し時だけ縮めていたが、
 *   - 注釈まで一緒に縮んで読めなくなる → state 側で補正 → 編集画面と出力が食い違う
 *   - 縮小表示のまま作業すると字が打ちにくい / 位置も仕上がりの大きさも分からない
 * と問題が連鎖したのでやめた。
 *
 * サイズを変えると **エディタごと作り直す**。既存の注釈は marker.js が state を
 * 自動で比率調整してくれるので失われない(900→360 で座標も線幅もちょうど 0.4 倍)。
 * 縮小は毎回**原本から**作るので、サイズを往復しても劣化しない。
 * ─────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';
  var q    = new URLSearchParams(location.search);
  var orig = q.get('f') || '';    // 原本の絶対パス（サーバが読み書きの基準にする）
  var sock = q.get('sock') || ''; // 呼び出し元 nvim の v:servername（保存通知先）
  var buf  = q.get('buf') || '';  // リンク元 md のバッファ番号

  var nameEl    = document.getElementById('name');
  var msgEl     = document.getElementById('msg');
  var grainSel  = document.getElementById('grain');
  var mosaicBtn = document.getElementById('mosaic');
  var wIn       = document.getElementById('w');
  var restEl    = document.getElementById('rest');
  var pctEl     = document.getElementById('pct');
  var applyBtn  = document.getElementById('apply');
  var viewEl    = document.getElementById('view');
  var host      = document.getElementById('host');

  nameEl.textContent = orig.split('/').pop() || '(no file)';
  document.title = 'annot: ' + nameEl.textContent;

  function say(text, isError) {
    msgEl.textContent = text;
    msgEl.className = isError ? 'err' : '';
  }
  if (!orig) { return say('?f= に画像パスが必要です', true); }

  // いまエディタに載せているもの
  var original = null;   // 原本(原寸)。縮小は常にここから作る＝往復しても劣化しない
  var current  = null;   // 作業サイズの画像
  var editor   = null;
  var ma       = null;
  var MosaicMarker = null;
  var mosaicUrl = '';

  // 画像は同一オリジン(/img)から配信される。外部URLを直接読むと canvas が汚染されて
  // ラスタ書き出し(toDataURL)が落ちるため、必ずサーバ経由にする。
  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = function () { reject(new Error('画像を読めません: ' + src)); };
      im.src = src;
    });
  }

  // 縮小は品質が効くところ。drawImage 一発だと縮小率が大きいときに参照する元画素が
  // 足りず、モアレ/線の太さのばらつきが出る（実測 2560→360 で、高品質リサンプラとの
  // 差が 8.65 対 6.21。細い縦線が不揃いになるのが目で見て分かる）。
  //   第一手  createImageBitmap の resizeQuality:'high'（1回で済む）
  //   代替    半分ずつ詰める段階縮小（上と同等の結果になることを実測で確認）
  function stepwiseCanvas(src, w, h) {
    var cw = src.naturalWidth, ch = src.naturalHeight;
    var cur = document.createElement('canvas');
    cur.width = cw; cur.height = ch;
    var cx = cur.getContext('2d');
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
    cx.drawImage(src, 0, 0);
    while (cw / 2 > w) {                       // 目標の2倍以内になるまで半分ずつ
      var nw = Math.max(w, Math.round(cw / 2));
      var nh = Math.max(h, Math.round(ch / 2));
      var n = document.createElement('canvas');
      n.width = nw; n.height = nh;
      var nx = n.getContext('2d');
      nx.imageSmoothingEnabled = true; nx.imageSmoothingQuality = 'high';
      nx.drawImage(cur, 0, 0, nw, nh);
      cur = n; cw = nw; ch = nh;
    }
    var out = document.createElement('canvas');
    out.width = w; out.height = h;
    var ox = out.getContext('2d');
    ox.imageSmoothingEnabled = true; ox.imageSmoothingQuality = 'high';
    ox.drawImage(cur, 0, 0, w, h);
    return out;
  }

  // 作業サイズの画像を用意する。まず**サーバ(Pillow)に縮小させる**——ブラウザの
  // createImageBitmap より忠実（実測 2560→360 で、Pillow を基準にした RMS 差が
  // ブラウザ側 6.21 に対しサーバ側は 0）。Pillow が無い環境ではサーバが原寸を返して
  // X-Resize: none を付けるので、その場合だけブラウザ側の縮小に落ちる。
  function workingImage(w) {
    if (!original || w >= original.naturalWidth) return Promise.resolve(original);
    return fetch('/img?p=' + encodeURIComponent(orig) + '&w=' + w)
      .then(function (r) {
        if (!r.ok) throw new Error('img ' + r.status);
        if ((r.headers.get('X-Resize') || 'none') !== 'pillow') return null;
        return r.blob().then(function (b) { return loadImage(URL.createObjectURL(b)); });
      })
      .then(function (im) { return im || scaledImage(original, w); })
      .catch(function () { return scaledImage(original, w); });
  }

  // フォールバック（サーバで縮小できなかったとき）。
  function scaledImage(src, w) {
    if (w >= src.naturalWidth) return Promise.resolve(src);
    var h = Math.max(1, Math.round(src.naturalHeight * w / src.naturalWidth));
    var toCanvas;
    if (typeof createImageBitmap === 'function') {
      toCanvas = createImageBitmap(src, { resizeWidth: w, resizeHeight: h, resizeQuality: 'high' })
        .then(function (bmp) {
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(bmp, 0, 0);
          bmp.close && bmp.close();
          return c;
        })
        .catch(function () { return stepwiseCanvas(src, w, h); });
    } else {
      toCanvas = Promise.resolve(stepwiseCanvas(src, w, h));
    }
    return toCanvas.then(function (c) { return loadImage(c.toDataURL('image/png')); });
  }

  // 画像全体を一度だけモザイク化した data URL。各モザイクマーカーはこれを
  // 「元画像と同じ座標」に置いて矩形でクリップするだけなので、矩形を動かしても
  // 常にその真下の領域が出る（切り出しを貼る方式だと古い絵が付いてくる）。
  function makeMosaicUrl(image, block) {
    var w = image.naturalWidth, h = image.naturalHeight;
    var sw = Math.max(1, Math.round(w / block)), sh = Math.max(1, Math.round(h / block));
    var small = document.createElement('canvas');
    small.width = sw; small.height = sh;
    small.getContext('2d').drawImage(image, 0, 0, sw, sh);   // 一旦うんと縮めて
    var big = document.createElement('canvas');
    big.width = w; big.height = h;
    var c = big.getContext('2d');
    c.imageSmoothingEnabled = false;                          // 補間なしで戻す = ブロック状
    c.drawImage(small, 0, 0, sw, sh, 0, 0, w, h);
    return big.toDataURL('image/png');
  }

  // 自作マーカー(モザイク)。対象画像ごとに作る必要があるので関数で包む。
  function makeMosaicType(image) {
    var NS = 'http://www.w3.org/2000/svg';
    var seq = 0;
    return class MosaicMarkerImpl extends markerjs3.ShapeOutlineMarkerBase {
      static typeName = 'MosaicMarker';
      static title = 'Mosaic';
      static applyDefaultFilter = false;   // 影が付くと潰した感じが濁るので切る

      constructor(container) {
        super(container);
        this.strokeWidth = 0;
        this._clipId = 'mosaic-clip-' + (++seq);
      }

      createVisual() {
        var g = document.createElementNS(NS, 'g');
        var clip = document.createElementNS(NS, 'clipPath');
        clip.id = this._clipId;
        this._clipRect = document.createElementNS(NS, 'rect');
        clip.appendChild(this._clipRect);
        this._image = document.createElementNS(NS, 'image');
        this._image.setAttribute('href', mosaicUrl);
        this._image.setAttribute('width', image.naturalWidth);
        this._image.setAttribute('height', image.naturalHeight);
        this._image.setAttribute('preserveAspectRatio', 'none');
        this._image.setAttribute('clip-path', 'url(#' + this._clipId + ')');
        this._image.dataset.mosaic = '1';   // 粗さ変更時に href を貼り替える目印
        g.appendChild(clip);
        g.appendChild(this._image);
        this.visual = g;
        this.addMarkerVisualToContainer(g);
        this.adjustMosaic();
      }

      adjustMosaic() {
        if (!this._image) return;
        this._clipRect.setAttribute('x', 0);
        this._clipRect.setAttribute('y', 0);
        this._clipRect.setAttribute('width', Math.max(0, this.width));
        this._clipRect.setAttribute('height', Math.max(0, this.height));
        this._image.setAttribute('x', -this.left);
        this._image.setAttribute('y', -this.top);
      }

      adjustVisual() { this.adjustMosaic(); }
      setSize() { super.setSize(); this.adjustMosaic(); }
      moveVisual(point) { super.moveVisual(point); this.adjustMosaic(); }
      ownsTarget(el) { return super.ownsTarget(el) || el === this._image; }
    };
  }

  function updatePanel() {
    wIn.value = current.naturalWidth;
    restEl.textContent = '× ' + current.naturalHeight + ' px';
    pctEl.textContent = Math.round(current.naturalWidth / original.naturalWidth * 100) + '%';
  }
  function updateView() {
    viewEl.textContent = '表示 ' + Math.round((ma && ma.zoomLevel || 1) * 100) + '%';
  }

  // エディタを作り直して state を載せ直す。
  // state の座標系(state.width)と対象画像の大きさが違うとき、marker.js が自動で
  // 比率調整してくれる＝サイズを変えても描いた注釈は失われない。
  function mount(image, state) {
    current = image;
    mosaicUrl = makeMosaicUrl(image, parseInt(grainSel.value, 10));
    MosaicMarker = makeMosaicType(image);

    host.innerHTML = '';
    editor = new markerjsUI.AnnotationEditor();
    editor.targetImage = image;
    editor.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    host.appendChild(editor);

    ma = editor.markerArea;
    ma.registerMarkerType(MosaicMarker, markerjs3.ShapeOutlineMarkerEditor);

    // 1:1 で描くので書き出しは常に原寸。補正は要らない。
    editor.settings.renderOnSave = false;          // 自作マーカーを焼くため自前でラスタライズ
    editor.settings.rendererSettings.naturalSize = true;
    editor.settings.rendererSettings.imageType = 'image/png';
    editor.settings.autoZoomOut = true;            // 大きい画像は全体が見えるように収める
    editor.settings.autoZoomIn = false;            // 小さい画像を無理に拡大はしない

    if (state) {
      try { editor.restoreState(state); }
      catch (e) { say('注釈の復元に失敗: ' + e.message, true); }
    }

    editor.shadowRoot.addEventListener('click', function () {
      setTimeout(function () { updateView(); mosaicBtn.classList.remove('on'); }, 0);
    }, true);
    editor.shadowRoot.addEventListener('wheel', function () { setTimeout(updateView, 0); }, true);

    editor.addEventListener('editorsave', onSave);

    updatePanel();
    setTimeout(updateView, 300);   // autoZoom の結果が入るのを待つ
  }

  // 保存と同じ経路で PNG を焼く。内蔵のラスタライズは自作マーカー型を知らない
  // （＝画面では潰れているのに保存した PNG は素通し）ので自前の Renderer を使う。
  function rasterize(state) {
    var r = new markerjs3.Renderer();
    r.targetImage = current;
    r.registerMarkerType(MosaicMarker);
    r.naturalSize = true;
    r.imageType = 'image/png';
    return r.rasterize(state);
  }

  function onSave(ev) {
    say('保存中…');
    rasterize(ev.detail.state).then(function (dataUrl) {
      return fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          orig: orig, sock: sock, buf: buf,
          state: ev.detail.state,
          dataUrl: dataUrl,
        }),
      }).then(function (r) { return r.json(); });
    }).then(function (r) {
      if (r.ok) { say('保存: ' + r.ann.split('/').pop()); }
      else { say('保存失敗: ' + (r.error || '?'), true); }
    }).catch(function (e) { say('保存失敗: ' + e.message, true); });
  }

  // --- パネル操作 ---------------------------------------------------------
  function applyWidth() {
    var v = parseInt(wIn.value, 10);
    var w = (!v || v <= 0) ? original.naturalWidth
                           : Math.max(16, Math.min(original.naturalWidth, v));
    if (w === current.naturalWidth) { updatePanel(); return; }
    var state = ma.getState();          // 旧サイズ基準。mount 側で自動調整される
    say('作り直し中…');
    workingImage(w).then(function (im) {
      mount(im, state);
      say('作業サイズ: ' + im.naturalWidth + ' × ' + im.naturalHeight + ' px');
    }).catch(function (e) { say('作り直しに失敗: ' + e.message, true); });
  }
  applyBtn.addEventListener('click', applyWidth);
  wIn.addEventListener('change', applyWidth);
  wIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') applyWidth(); });

  mosaicBtn.addEventListener('click', function () {
    ma.createMarker(MosaicMarker);   // 以後、画像上をドラッグすると矩形が引ける
    mosaicBtn.classList.add('on');
  });

  grainSel.addEventListener('change', function () {
    mosaicUrl = makeMosaicUrl(current, parseInt(grainSel.value, 10));
    ma.shadowRoot.querySelectorAll('image[data-mosaic]').forEach(function (el) {
      el.setAttribute('href', mosaicUrl);
    });
  });

  // --- 起動 ---------------------------------------------------------------
  Promise.all([
    loadImage('/img?p=' + encodeURIComponent(orig)),
    fetch('/state?p=' + encodeURIComponent(orig)).then(function (r) { return r.json(); }),
  ]).then(function (res) {
    original = res[0];
    var saved = res[1] && res[1].state;
    // 前回の作業サイズは state.width が覚えている（marker.js の AnnotationState が
    // キャンバスの大きさを持つため、こちらで別途保存しなくてよい）。
    var w = (saved && saved.width) ? Math.min(saved.width, original.naturalWidth)
                                   : original.naturalWidth;
    return workingImage(w).then(function (im) {
      mount(im, saved);
      if (saved) say('前回の注釈を復元');
    });
  }).catch(function (e) { say(e.message, true); });
})();
</script>
</body>
</html>
