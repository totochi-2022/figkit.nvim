<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>annot</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #f6f6f6; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #ddd; } }
  #bar {
    flex: 0 0 auto; display: flex; gap: .75rem; align-items: center;
    padding: .35rem .6rem; font-size: 12px; border-bottom: 1px solid #8884;
  }
  #name { font-weight: 600; }
  #mosaic, #grain { font: inherit; font-size: 12px; padding: .1rem .4rem; cursor: pointer; }
  #mosaic.on { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  #note { opacity: .6; }
  #msg { margin-left: auto; opacity: .85; }
  #msg.err { color: #e06c75; opacity: 1; }
  #host { flex: 1 1 auto; min-height: 0; }
  mjsui-annotation-editor { display: block; width: 100%; height: 100%; }
  /* 書き出しサイズの表示＋指定。エディタ右下のズームボタンのすぐ上に重ねる */
  #sizebox {
    position: fixed; right: 14px; bottom: 54px; z-index: 10;
    display: flex; align-items: center; gap: .3rem;
    padding: .25rem .5rem; font-size: 12px; border-radius: 6px;
    background: #fffffff2; border: 1px solid #8886; color: #222;
    box-shadow: 0 1px 4px #0002;
  }
  @media (prefers-color-scheme: dark) {
    #sizebox { background: #2b2b2bf2; border-color: #aaa5; color: #ddd; }
  }
  #w { width: 4.2rem; font: inherit; text-align: right; padding: .1rem .2rem; }
  #pct { opacity: .7; }
  #sizebox .lbl { opacity: .7; }
  #view { opacity: .55; border-left: 1px solid #8884; padding-left: .45rem; }
  #fit { font: inherit; font-size: 11px; padding: 0 .3rem; cursor: pointer; }
</style>
</head>
<body>
<div id="bar">
  <span id="name">…</span>
  <button id="mosaic" type="button" title="ドラッグした矩形をモザイクで潰します">▦ モザイク</button>
  <select id="grain" title="モザイクの粗さ">
    <option value="8">細かい</option>
    <option value="14" selected>ふつう</option>
    <option value="26">粗い</option>
  </select>
  <span id="note">保存サイズは右下の「書き出し」欄。 − / + は表示だけで保存サイズは変わりません</span>
  <span id="msg"></span>
</div>
<div id="host"></div>
<div id="sizebox">
  <span class="lbl">書き出し</span>
  <input id="w" type="number" min="16" step="10" title="保存される画像の幅[px]。空にすると原寸">
  <span id="rest">×  ―</span>
  <span id="pct">―</span>
  <button id="fit" type="button" title="表示を書き出しサイズに合わせて確認する">⇄</button>
  <span id="view">表示 100%</span>
</div>

<!-- markerjs3(グローバル markerjs3) → markerjs-ui(グローバル markerjsUI) の順で読む -->
<script src="vendor/markerjs3.umd.js"></script>
<script src="vendor/markerjs-ui.umd.js"></script>
<script>
(function () {
  'use strict';
  var q    = new URLSearchParams(location.search);
  var orig = q.get('f') || '';    // 原本の絶対パス（サーバが読み書きの基準にする）
  var sock = q.get('sock') || ''; // 呼び出し元 nvim の v:servername（保存通知先）
  var buf  = q.get('buf') || '';  // リンク元 md のバッファ番号

  var nameEl   = document.getElementById('name');
  var grainSel = document.getElementById('grain');
  var mosaicBtn = document.getElementById('mosaic');
  var msgEl  = document.getElementById('msg');
  nameEl.textContent = orig.split('/').pop() || '(no file)';
  document.title = 'annot: ' + nameEl.textContent;

  function say(text, isError) {
    msgEl.textContent = text;
    msgEl.className = isError ? 'err' : '';
  }

  if (!orig) { return say('?f= に画像パスが必要です', true); }

  // 画像は同一オリジン(/img)から配信される。外部URLを直接読むと canvas が汚染されて
  // ラスタ書き出し(toDataURL)が落ちるため、必ずサーバ経由にする。
  var img = new Image();
  img.src = '/img?p=' + encodeURIComponent(orig);

  // 画像全体を一度だけモザイク化した data URL を作る。
  // 各モザイクマーカーはこれを「原本と同じ座標」に置いてクリップするだけなので、
  // 矩形を動かしても常にその真下の領域が出る（切り出しを貼る方式だと古い絵が付いてくる）。
  function makeMosaicUrl(image, block) {
    var w = image.naturalWidth, h = image.naturalHeight;
    var sw = Math.max(1, Math.round(w / block)), sh = Math.max(1, Math.round(h / block));
    var small = document.createElement('canvas');
    small.width = sw; small.height = sh;
    small.getContext('2d').drawImage(image, 0, 0, sw, sh);   // 一旦うんと縮めて
    var big = document.createElement('canvas');
    big.width = w; big.height = h;
    var c = big.getContext('2d');
    c.imageSmoothingEnabled = false;                          // 補間なしで戻す = ブロック状になる
    c.drawImage(small, 0, 0, sw, sh, 0, 0, w, h);
    return big.toDataURL('image/png');
  }

  Promise.all([
    new Promise(function (resolve, reject) {
      img.onload = resolve;
      img.onerror = function () { reject(new Error('画像を読めません: ' + orig)); };
    }),
    fetch('/state?p=' + encodeURIComponent(orig)).then(function (r) { return r.json(); }),
  ]).then(function (res) {
    var saved = res[1] && res[1].state;

    // --- 自作マーカー: モザイク -------------------------------------------------
    // 原本と同じ大きさのモザイク画像を、マーカーの矩形でクリップして見せる。
    // 中身の座標は -left/-top にずらすので、動かしてもリサイズしても真下の領域が出る。
    var mosaicUrl = makeMosaicUrl(img, parseInt(grainSel.value, 10));
    var mosaicSeq = 0;
    var NS = 'http://www.w3.org/2000/svg';

    class MosaicMarker extends markerjs3.ShapeOutlineMarkerBase {
      static typeName = 'MosaicMarker';
      static title = 'Mosaic';
      static applyDefaultFilter = false; // 影が付くと潰した感じが濁るので切る

      constructor(container) {
        super(container);
        this.strokeWidth = 0;
        this._clipId = 'mosaic-clip-' + (++mosaicSeq);
      }

      createVisual() {
        var g = document.createElementNS(NS, 'g');
        var clip = document.createElementNS(NS, 'clipPath');
        clip.id = this._clipId;
        this._clipRect = document.createElementNS(NS, 'rect');
        clip.appendChild(this._clipRect);
        this._image = document.createElementNS(NS, 'image');
        this._image.setAttribute('href', mosaicUrl);
        this._image.setAttribute('width', img.naturalWidth);
        this._image.setAttribute('height', img.naturalHeight);
        this._image.setAttribute('preserveAspectRatio', 'none');
        this._image.setAttribute('clip-path', 'url(#' + this._clipId + ')');
        this._image.dataset.mosaic = '1';   // 粗さ変更時に href を貼り替える目印
        g.appendChild(clip);
        g.appendChild(this._image);
        this.visual = g;
        this.addMarkerVisualToContainer(g);
        this.adjustMosaic();
      }

      adjustMosaic() {
        if (!this._image) return;
        this._clipRect.setAttribute('x', 0);
        this._clipRect.setAttribute('y', 0);
        this._clipRect.setAttribute('width', Math.max(0, this.width));
        this._clipRect.setAttribute('height', Math.max(0, this.height));
        this._image.setAttribute('x', -this.left);
        this._image.setAttribute('y', -this.top);
      }

      adjustVisual() { this.adjustMosaic(); }
      setSize() { super.setSize(); this.adjustMosaic(); }
      moveVisual(point) { super.moveVisual(point); this.adjustMosaic(); }
      ownsTarget(el) { return super.ownsTarget(el) || el === this._image; }
    }
    // ---------------------------------------------------------------------------

    var editor = new markerjsUI.AnnotationEditor();
    editor.targetImage = img;
    editor.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.getElementById('host').appendChild(editor);

    // 内蔵のレンダラは自作マーカー型を知らない＝モザイクが焼かれない。
    // そこで書き出しは自前の Renderer で行う（registerMarkerType で型を教えられる）。
    editor.settings.renderOnSave = false;
    editor.settings.rendererSettings.imageType = 'image/png';
    // 読み込み直後を必ず 100% にする。自動ズームが効くと「見たまま」が
    // ペイン幅次第で変わってしまい、書き出しサイズが予測できなくなる。
    editor.settings.autoZoomIn = false;
    editor.settings.autoZoomOut = false;

    // 書き出しサイズ = 編集画面の表示倍率（右下の − / ⊡ / + で変えた値）。
    // 見たままが保存される。拡大方向には焼かない（水増ししてもボケるだけなので 100% で頭打ち）。
    var ma   = editor.markerArea;

    // 自作型を編集側に登録。矩形をドラッグして作る型なので編集UIは既製の
    // ShapeOutlineMarkerEditor をそのまま使う。
    ma.registerMarkerType(MosaicMarker, markerjs3.ShapeOutlineMarkerEditor);

    // 縮小中に作ったマーカーのサイズ補正。
    // 文字サイズ・線幅は「画像の座標系」で持つので、50% 表示のときに既定値のまま作ると
    // 画面でも書き出しでも半分の大きさになってしまう（縮小するほど字が小さくなる）。
    // 作成時に倍率の逆数を掛けておくと、画面で見えている通りの大きさで焼ける。
    mosaicBtn.addEventListener('click', function () {
      ma.createMarker(MosaicMarker);  // 以後、画像上をドラッグすると矩形が引ける
      mosaicBtn.classList.add('on');
    });
    // 他のツールを選んだら押下表示を戻す
    editor.shadowRoot.addEventListener('click', function () {
      setTimeout(function () { mosaicBtn.classList.remove('on'); }, 0);
    }, true);

    // 粗さ変更: モザイク画像を作り直し、既存マーカーの href を貼り替える
    grainSel.addEventListener('change', function () {
      mosaicUrl = makeMosaicUrl(img, parseInt(grainSel.value, 10));
      ma.shadowRoot.querySelectorAll('image[data-mosaic]').forEach(function (el) {
        el.setAttribute('href', mosaicUrl);
      });
    });

    var wIn    = document.getElementById('w');
    var rest   = document.getElementById('rest');
    var pct    = document.getElementById('pct');
    var viewEl = document.getElementById('view');
    var fitBtn = document.getElementById('fit');

    // 表示倍率 → 書き出しサイズ。拡大方向には焼かない(水増ししてもボケるだけ)ので 100% で頭打ち。
    // 書き出し幅は**表示倍率と独立**に持つ。
    // 以前は「表示倍率＝書き出しサイズ」にしていたが、小さく出したいときに縮小表示のまま
    // 作業することになり、文字が打ちにくかった。分けておけば、表示は 100% に戻して普通に
    // 編集しつつ、保存されるのは指定した幅、という使い方ができる。
    var exportW = img.naturalWidth;

    function updateExport(keepInput) {
      exportW = Math.max(16, Math.min(img.naturalWidth, Math.round(exportW)));
      var z  = exportW / img.naturalWidth;
      var h  = Math.round(img.naturalHeight * z);
      var rs = editor.settings.rendererSettings;
      if (z >= 1) {
        rs.naturalSize = true;            // 原寸
      } else {
        rs.naturalSize = false;           // width/height は両方を設定しないと効かない
        rs.width = exportW;
        rs.height = h;
      }
      if (!keepInput) wIn.value = exportW;
      rest.textContent = '× ' + h + ' px';
      pct.textContent = Math.round(z * 100) + '%';
    }

    function updateView() {
      viewEl.textContent = '表示 ' + Math.round((ma.zoomLevel || 1) * 100) + '%';
    }

    // 表示を書き出しサイズに合わせる（仕上がりの確認用）。
    function fitViewToExport() {
      ma.zoomLevel = exportW / img.naturalWidth;
      if (ma.applyTransform) ma.applyTransform();   // 代入だけでは再描画されない
      updateView();
    }

    function applyWidth() {
      var v = parseInt(wIn.value, 10);
      exportW = (!v || v <= 0) ? img.naturalWidth : v;
      updateExport();
      fitViewToExport();   // 打ち込んだ直後は仕上がりを見せる（その後 + で戻して編集できる）
    }
    wIn.addEventListener('change', applyWidth);
    wIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') applyWidth(); });
    fitBtn.addEventListener('click', fitViewToExport);

    // ズームボタン/ホイールは**表示だけ**を変える（書き出し幅には触らない）。
    function onZoomed() { setTimeout(updateView, 0); }
    editor.shadowRoot.addEventListener('click', onZoomed, true);
    editor.shadowRoot.addEventListener('wheel', onZoomed, true);
    updateExport();
    updateView();

    if (saved) {
      try { editor.restoreState(saved); say('前回の注釈を復元'); }
      catch (e) { say('state の復元に失敗: ' + e.message, true); }
    }

    // state から PNG を焼く。サイズは右下パネルの設定をそのまま使う。
    // 縮小して書き出すとき、注釈の文字と線まで一緒に縮むと読めなくなる
    //（「書いたあとに縮小したら字が小さくなる」）。書き出しは画像を z 倍に縮めるので、
    // state 側で文字サイズと線幅を 1/z 倍しておくと、出力での絶対サイズが原寸のときと揃う。
    //
    // なぜ編集中のマーカーを直接いじらないか: marker.js UI は**新しいマーカーを作るたびに
    // 既存マーカーのスタイルを既定値へ書き戻す**ため、ライブに書いた補正は2個目を足した
    // 時点で消える。state は書き出し直前のコピーなので誰にも上書きされない。
    function compensateState(state, z) {
      if (!(z > 0) || z >= 1) return state;
      var k = 1 / z;
      var st = JSON.parse(JSON.stringify(state));
      (st.markers || []).forEach(function (m) {
        if (m.fontSize && typeof m.fontSize.value === 'number') {
          m.fontSize = { value: m.fontSize.value * k, units: m.fontSize.units, step: m.fontSize.step };
        }
        if (typeof m.strokeWidth === 'number' && m.strokeWidth > 0) {
          m.strokeWidth = m.strokeWidth * k;
        }
      });
      return st;
    }

    function rasterize(state) {
      updateExport(true); // 入力欄の値を正として設定を確定させる
      var rs = editor.settings.rendererSettings;
      var r = new markerjs3.Renderer();
      r.targetImage = img;
      r.registerMarkerType(MosaicMarker);
      r.naturalSize = rs.naturalSize;
      r.imageType = rs.imageType;
      var z = 1;
      if (!rs.naturalSize) { r.width = rs.width; r.height = rs.height; z = rs.width / img.naturalWidth; }
      return r.rasterize(compensateState(state, z));
    }

    editor.addEventListener('editorsave', function (ev) {
      say('保存中…');
      rasterize(ev.detail.state).then(function (dataUrl) {
      fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          orig: orig, sock: sock, buf: buf,
          state: ev.detail.state,
          dataUrl: dataUrl,
        }),
      })
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (r.ok) { say('保存: ' + r.ann.split('/').pop()); }
          else { say('保存失敗: ' + (r.error || '?'), true); }
        })
        .catch(function (e) { say('保存失敗: ' + e.message, true); });
      }).catch(function (e) { say('書き出し失敗: ' + e.message, true); });
    });

    editor.addEventListener('editorclose', function () {
      say('閉じる（ペインは ss→p で閉じられます）');
    });
  }).catch(function (e) {
    say(e.message, true);
  });
})();
</script>
</body>
</html>
